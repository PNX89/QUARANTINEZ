<rect width="842" height="621" rx="8" fill="#14141a"/>
<circle cx="20" cy="15" r="5" fill="#e05a51"/><circle cx="38" cy="15" r="5" fill="#e0b341"/><circle cx="56" cy="15" r="5" fill="#57b95a"/>
<text x="18" y="34" class="cmd" style="animation:l0 5850ms steps(1,end) infinite">$ uv run python examples/venue_session.py</text><text x="18" y="53" style="animation:l1 5850ms steps(1,end) infinite"></text><text x="18" y="72" style="animation:l2 5850ms steps(1,end) infinite">Five orders against five venues. Only one of them ends with an answer.</text><text x="18" y="91" style="animation:l3 5850ms steps(1,end) infinite"></text><text x="18" y="110" style="animation:l4 5850ms steps(1,end) infinite">&gt;&gt;&gt; place(order, venue=&apos;well behaved&apos;)</text><text x="18" y="129" style="animation:l5 5850ms steps(1,end) infinite">    FILLED</text><text x="18" y="148" style="animation:l6 5850ms steps(1,end) infinite"></text><text x="18" y="167" style="animation:l7 5850ms steps(1,end) infinite">&gt;&gt;&gt; place(order, venue=&apos;accepts then goes quiet&apos;)</text><text x="18" y="186" style="animation:l8 5850ms steps(1,end) infinite">    UNKNOWN via SILENCE</text><text x="18" y="205" style="animation:l9 5850ms steps(1,end) infinite"></text><text x="18" y="224" style="animation:l10 5850ms steps(1,end) infinite">&gt;&gt;&gt; place(order, venue=&apos;acknowledges twice&apos;)</text><text x="18" y="243" style="animation:l11 5850ms steps(1,end) infinite">    UNKNOWN via DOUBLE_ACK</text><text x="18" y="262" style="animation:l12 5850ms steps(1,end) infinite"></text><text x="18" y="281" style="animation:l13 5850ms steps(1,end) infinite">&gt;&gt;&gt; place(order, venue=&apos;answers about something else&apos;)</text><text x="18" y="300" style="animation:l14 5850ms steps(1,end) infinite">    UNKNOWN via FOREIGN_ID</text><text x="18" y="319" style="animation:l15 5850ms steps(1,end) infinite"></text><text x="18" y="338" style="animation:l16 5850ms steps(1,end) infinite">&gt;&gt;&gt; place(order, venue=&apos;fills a quantity nobody sent&apos;)</text><text x="18" y="357" style="animation:l17 5850ms steps(1,end) infinite">    UNKNOWN via UNASKED_QUANTITY</text><text x="18" y="376" style="animation:l18 5850ms steps(1,end) infinite"></text><text x="18" y="395" style="animation:l19 5850ms steps(1,end) infinite">4 of 5 ended unconfirmed. None of them is a failure to retry:</text><text x="18" y="414" style="animation:l20 5850ms steps(1,end) infinite">each is a terminal state, and each is handed to a person by name.</text><text x="18" y="433" style="animation:l21 5850ms steps(1,end) infinite"></text><text x="18" y="452" style="animation:l22 5850ms steps(1,end) infinite">The breaker, walked over the committed marks. Every number below is invented.</text><text x="18" y="471" style="animation:l23 5850ms steps(1,end) infinite"></text><text x="18" y="490" style="animation:l24 5850ms steps(1,end) infinite">  date        mark    drawdown  breaker   obligation</text><text x="18" y="509" style="animation:l25 5850ms steps(1,end) infinite">  2026-01-15   108.4     0.000  ARMED     NONE</text><text x="18" y="528" style="animation:l26 5850ms steps(1,end) infinite">  2026-01-26    96.1     0.113  TRIPPED   OPEN</text><text x="18" y="547" style="animation:l27 5850ms steps(1,end) infinite">  2026-01-27    94.7     0.126  TRIPPED   OPEN</text><text x="18" y="566" style="animation:l28 5850ms steps(1,end) infinite"></text><text x="18" y="585" style="animation:l29 5850ms steps(1,end) infinite">... 12 more lines, in full on the card</text>
</svg>
