name: CI

# Nothing here reaches the network and nothing here needs a key. The one service in
# compose.yaml is for the crash proof, which runs in its own job below rather than in the
# interpreter matrix, because a test that quietly requires a container is a test that passes
# here and fails for a stranger.
#
# The shared legs live in PNX89/.github and are pinned to a tag rather than a branch, so a
# commit in that repository cannot turn this badge red. What the pipeline is for, and the five
# things it deliberately does not gate, is argued at
# https://github.com/PNX89/.github/blob/main/docs/adr/0001-what-ci-is-for.md

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      sync-args: "--dev"
      run-mypy: true

  # The crash proof needs a real database, because the claim is about what survives a process
  # being killed and an in-memory stand-in cannot make that claim.
  containers:
    name: the control state against a real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quarantinez
          POSTGRES_PASSWORD: quarantinez-demo
          POSTGRES_DB: quarantinez
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U quarantinez -d quarantinez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m services -q
